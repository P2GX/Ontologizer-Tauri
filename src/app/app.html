<app-welcome-dialog></app-welcome-dialog>

<div class="app-shell">

    <!-- Custom title bar (replaces native OS decorations) -->
    <div class="titlebar" (mousedown)="startDrag($event)">
<div class="titlebar-controls" (mousedown)="$event.stopPropagation()">
            <button class="titlebar-btn" (click)="minimizeWindow()" aria-label="Minimize">
                <mat-icon>remove</mat-icon>
            </button>
            <button class="titlebar-btn" (click)="toggleMaximize()" aria-label="Maximize">
                <mat-icon>crop_square</mat-icon>
            </button>
            <button class="titlebar-btn titlebar-btn--close" (click)="closeWindow()" aria-label="Close">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </div>

    <!-- Added autosize so the main content adjusts automatically to width changes -->
    <mat-sidenav-container class="sidenav-container" autosize>

        <!-- Sidebar Navigation -->
        <!-- We keep the drawer open at all times, but toggle the 'collapsed' CSS class -->
        <mat-sidenav class="sidenav" [class.collapsed]="isCollapsed()" mode="side" [opened]="true">

            <!-- Header in Sidebar -->
            <div class="sidenav-header">
                <!-- Burger menu calls toggleMenu() instead of drawer.toggle() -->
                <button mat-icon-button (click)="toggleMenu()" class="menu-button" aria-label="Toggle sidenav">
                    <mat-icon>menu</mat-icon>
                </button>

                <div class="logo-title">
                    <img src="assets/icons/ontology.svg" alt="onto" class="logo-icon" />
                    <h2>Ontologizer</h2>
                </div>
            </div>

            <!-- Navigation Menu -->
            <mat-nav-list>
                <a mat-list-item routerLink="/files" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"
                   class="nav-item">
                    <mat-icon matListItemIcon>upload_file</mat-icon>
                    <span matListItemTitle>Files</span>
                </a>
                <a mat-list-item routerLink="/method" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"
                   class="nav-item">
                    <mat-icon matListItemIcon>model_training</mat-icon>
                    <span matListItemTitle>Method</span>
                </a>

                <a mat-list-item routerLink="/results" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"
                   class="nav-item">
                    <mat-icon matListItemIcon>bar_chart_4_bars</mat-icon>
                    <span matListItemTitle>Results</span>
                </a>
                <mat-divider></mat-divider>
                <a mat-list-item routerLink="/help" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"
                   class="nav-item">
                    <mat-icon matListItemIcon>help_outline</mat-icon>
                    <span matListItemTitle>Help</span>
                </a>

                <a mat-list-item routerLink="/contact" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"
                   class="nav-item">
                    <mat-icon matListItemIcon>contact_mail</mat-icon>
                    <span matListItemTitle>Contact</span>
                </a>
            </mat-nav-list>

            <div class="sidenav-footer">
                <button type="button" class="sidenav-help" (click)="showWelcome()"
                        aria-label="Show welcome dialog"
                        [title]="isCollapsed() ? 'Show welcome' : ''">
                    <mat-icon>help_outline</mat-icon>
                    @if (!isCollapsed()) {
                        <span>Show welcome</span>
                    }
                </button>
            </div>

        </mat-sidenav>

        <!-- Main Content Area -->
        <mat-sidenav-content class="main-content">
            <!-- Page Content -->
            <div class="content">
                <router-outlet></router-outlet>
            </div>

        </mat-sidenav-content>

    </mat-sidenav-container>

</div>

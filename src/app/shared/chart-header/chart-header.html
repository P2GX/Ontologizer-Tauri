<div class="chart-header">

    <app-scope-selector
        [sizeOptions]="sizeOptions"
        [selectedSize]="selectedSize"
        [aspectOptions]="aspectOptions"
        [selectedAspect]="selectedAspect"
        [statisticOptions]="statisticOptions"
        [selectedStatistic]="selectedStatistic ?? ''"
        [statisticDisplayNames]="statisticDisplayNames"
        (sizeChange)="sizeChange.emit($event)"
        (aspectChange)="aspectChange.emit($event)"
        (statisticChange)="statisticChange.emit($event)">
    </app-scope-selector>

    <div class="header-spacer"></div>

    <app-legend [maxValue]="legendMaxValue" [isBayesian]="isBayesian" />

</div>

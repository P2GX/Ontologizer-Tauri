<div class="contact-body">
    <div class="contact-wrapper">
        <section class="contact-section">
            <h2>Authors</h2>
            <p>Ontologizer 3.0 is developed and maintained by the team below.</p>
            <div class="author-grid">
                @for (a of authors; track a.name) {
                    <article class="author-card">
                        <h3 class="author-name">{{ a.name }}</h3>
                        <p class="author-affiliation" [innerHTML]="a.affiliation"></p>
                        @if (a.orcid) {
                            <button type="button" class="link-button" (click)="open('https://orcid.org/' + a.orcid)">ORCID: {{ a.orcid }}</button>
                        }
                        @if (a.email) {
                            <button type="button" class="link-button" (click)="open('mailto:' + a.email)">{{ a.email }}</button>
                        }
                    </article>
                }
            </div>
        </section>

        <section class="contact-section">
            <h2>Repositories</h2>
            <ul class="repo-list">
                @for (r of repos; track r.url) {
                    <li>
                        <button type="button" class="link-button" (click)="open(r.url)">{{ r.label }}: {{ r.url }}</button>
                    </li>
                }
            </ul>
        </section>

        <section class="contact-section">
            <h2>License</h2>
            <p>
                Ontologizer 3.0 is distributed under the
                <button type="button" class="link-button" (click)="open(licenseUrl)">MIT License</button>.
            </p>
        </section>
    </div>
</div>

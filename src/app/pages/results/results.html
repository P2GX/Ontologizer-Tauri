<div class="page-header">
</div>

<div class="page-body">
    @if (success) {
        <div class="control-header">
            <div class="tabs-container">
                <button class="tab-button" [class.active]="selectedChart === 'dashboard'"
                    (click)="selectTab('dashboard')">
                    <span class="material-symbols-outlined tab-icon" aria-hidden="true">dashboard</span>
                    Summary
                </button>
                <mat-divider class="vertical" [vertical]="true"></mat-divider>
                <button class="tab-button" [class.active]="selectedChart === 'table'"
                    (click)="selectTab('table')">
                    <span class="material-symbols-outlined tab-icon" aria-hidden="true">data_table</span>
                    Table
                </button>
                <mat-divider class="vertical" [vertical]="true"></mat-divider>
                <button class="tab-button" [class.active]="selectedChart === 'go-graph'"
                    (click)="selectTab('go-graph')">
                    <span class="material-symbols-outlined tab-icon" aria-hidden="true">graph_4</span>
                    GO Graph
                </button>
                <mat-divider class="vertical" [vertical]="true"></mat-divider>
                <button class="tab-button" [class.active]="selectedChart === 'bar-plot'"
                    (click)="selectTab('bar-plot')">
                    <span class="material-symbols-outlined tab-icon" aria-hidden="true">finance</span>
                    Bar Plot
                </button>
            </div>
        </div>

        <div class="tab-panel">
            <app-dashboard
                [dashboardInfo]="dashboardInfo"
                [hidden]="selectedChart !== 'dashboard'">
            </app-dashboard>
            <app-result-table
                [tableData]="tableData()!"
                [totalCount]="totalCount()"
                [isFrequentist]="resultsService.isFrequentist()"
                [sortDirection]="resultsService.isBayesian() ? 'desc' : 'asc'"
                [hidden]="selectedChart !== 'table'"
                (pageChange)="onPageChange($event)">
            </app-result-table>
            <app-go-graph
                [hidden]="selectedChart !== 'go-graph'"
                [visible]="selectedChart === 'go-graph'"
                [dotData]="dotData"
                [legendMaxValue]="globalLegendMax"
                [isBayesian]="resultsService.isBayesian()">
            </app-go-graph>
            <app-bar-chart
                [hidden]="selectedChart !== 'bar-plot'"
                [PlotData]="resultsService.barPlotData()"
                [isBayesian]="resultsService.isBayesian()"
                [legendMaxValue]="globalLegendMax">
            </app-bar-chart>
        </div>

        <div class="action-button-container">
            <mat-divider class="horizontal" />
            <button class="button" (click)="saveResults()">
                Save Results
            </button>
            <mat-divider class="horizontal" />
        </div>
    }

    @if (!success) {
        <div class="empty-state">
            <span class="material-symbols-outlined empty-state-icon">labs</span>
            <h2>No results yet</h2>
            <p>Upload your files on the <strong>Files</strong> page and run the analysis on the <strong>Analysis</strong> page.</p>
        </div>
    }

</div>

<div class="chart-container">
    <app-chart-header
        [isBayesian]="isBayesian"
        [legendMaxValue]="legendMaxValue"
        [sizeOptions]="topNOptions"
        [selectedSize]="selectedTopN"
        [aspectOptions]="subgraphs"
        [selectedAspect]="selectedSubgraph"
        (sizeChange)="selectTopN($event)"
        (aspectChange)="selectSubgraph($event)"
        [statisticOptions]="isBayesian ? null : plotOptions"
        [selectedStatistic]="selectedPlotOption"
        [statisticDisplayNames]="plotDisplayNames"
        (statisticChange)="selectPlotOption($event)">
    </app-chart-header>

    <div class="container-body">
        <div #chartDiv class="chartDiv">
            <canvas #barCanvas></canvas>
        </div>
    </div>
</div>

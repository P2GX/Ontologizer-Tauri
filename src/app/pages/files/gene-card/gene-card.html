<div class="gene-card">

    <app-card-header
        [cardTitle]="cardTitle()"
        [tooltipType]="target() === 'population' ? 'pop' : 'study'"
        [ready]="!!filePath()" />

    <p class="card-description"></p>

    <div class="file-status" [class.file-loaded]="filePath()">
        <span class="material-symbols-outlined file-icon">
            {{ filePath() ? 'description' : 'folder_open' }}
        </span>
        <span class="file-name">{{ fileName() ?? 'No file selected' }}</span>
    </div>

    <button class="pick-button" (click)="openFileDialog()">
        <span class="material-symbols-outlined pick-icon">upload_file</span>
        {{ filePath() ? 'Change File' : 'Select File' }}
    </button>

    <span class="format-hint">Accepted: .txt</span>
</div>

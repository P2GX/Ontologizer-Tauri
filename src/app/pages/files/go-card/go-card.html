<div class="go-card">

    <app-card-header
        cardTitle="Gene Ontology"
        [subtitle]="version()"
        [ready]="!!filePath()" />

    <p class="card-description">

        <br> Download the latest Gene Ontology (GO) release automatically or select a local file.
    </p>

    <div class="file-status" [class.file-loaded]="filePath()">
        <span class="material-symbols-outlined file-icon">
            {{ filePath() ? 'description' : 'folder_open' }}
        </span>
        <span class="file-name">{{ fileName() ?? 'No file selected' }}</span>
    </div>

    <div class="button-row">
        <button class="button-secondary"
                (click)="downloadLatest()"
                [disabled]="downloading()">
            <span class="material-symbols-outlined">download</span>
            {{ filePath() ? 'Update' : 'Download' }}
        </button>

        <button class="button-tonal"
                (click)="openFileDialog()"
                [disabled]="downloading()">
            <span class="material-symbols-outlined">upload_file</span>
            {{ filePath() ? '' : '' }}
        </button>
    </div>

    <span class="format-hint">Accepted: .json</span>

</div>

<div class="page-header">
    <h1 class="page-title">Files</h1>
</div>

<div class="page-body">
    <div class="page-panel">

        <div class="upload-grid">
            <app-file-upload processFileType="go"
                             stepTitle="Upload Gene Ontology"
                             subtitle="Accepted File Types: .json"
                             (uploadSuccess)="onFileLoadedSuccess('go')" />

            <app-file-upload processFileType="annotation"
                             stepTitle="Upload Annotations"
                             subtitle="Accepted File Types: .gaf"
                             (uploadSuccess)="onFileLoadedSuccess('annotation')" />

            <app-gene-card title="Population Gene File"
                           subtitle="Accepted File Types: .txt"
                           target="population"
                           (uploadSuccess)="onFileLoadedSuccess('pop')" />

            <app-gene-card title="Study Gene File"
                           subtitle="Accepted File Types: .txt"
                           target="study"
                           (uploadSuccess)="onFileLoadedSuccess('study')" />
        </div>


        <div class="action-button-container" [class.disabled-state]="!allFilesLoaded()">
            <mat-divider class="horizontal" />
            <div class ="button-and-warning">
                <button class="button" [disabled]="!allFilesLoaded()" (click)="processFiles()">
                    {{ isProcessingAll() ? 'Processing...' : (isFinished() ? 'Finished!' : 'Process Files') }}
                </button>
            </div>
            <mat-divider class="horizontal" />
        </div>
    </div>
</div>

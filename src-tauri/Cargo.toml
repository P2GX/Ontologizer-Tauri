[package]
name = "Ontologizer-GUI"
version = "0.1.2"
description = "Rust (tauri) implementation of the Ontologizer application for characterizing GO Term Overrepresentation"
authors = ["Lukas Ramlow", "Jasmin Scholtes", "Daniel Danis", "Peter N. Robinson"]
license = "MIT"
repository = "https://github.com/P2GX/Ontologizer-Tauri"
default-run = "ontologizer"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "ontologizer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]

tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
ontolius = "0.5.4"
oboannotation = { git = "https://github.com/P2GX/oboannotation.git", tag = "v0.1.2" }
ontologizer = { git = "https://github.com/P2GX/ontologizer.git", branch = "master" }
tokio = { version = "1", features = ["full"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
dirs = "6.0"
toml = "0.9"
reqwest = { version = "0.12", features = ["stream"] }
flate2 = "1"
base64 = "0.22"

[dev-dependencies]

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
